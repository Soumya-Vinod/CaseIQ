name: Observability threshold alerts

# scripts/check_observability_thresholds.py's own module docstring has the
# full reasoning -- summary here: grounding_stats / punishment_verification_
# stats / citation_verification_stats (this project's own standing counters)
# plus 429/503 volume from audit_logs are signals that are individually
# NORMAL and only matter as a RATE, unlike an unhandled exception or a total
# LLM outage (Sentry, app.core.sentry -- a different tool for a different
# signal shape, see that module's own docstring). This job polls the real
# production database on a schedule and fails (triggering GitHub's own
# default failure-notification email -- no new webhook/service) when a rate
# crosses a threshold. Runs entirely outside the request path: zero added
# latency on any real query, by construction.
#
# Reuses secrets.NEON_DATABASE_URL_DIRECT -- the exact secret db-backup.yml
# already trusts with production credentials -- rather than provisioning a
# new one for read-only counter queries.
#
# State (last-observed counter values) persisted via actions/cache with a
# run-id-unique save key and a prefix restore-keys fallback -- the standard
# pattern for a cache that must be REWRITTEN every run rather than restored
# unchanged (github.run_id guarantees the exact-key restore always misses;
# restore-keys picks up the most recent prior save instead). KNOWN
# LIMITATION, not hidden: GitHub evicts a cache entry after ~7 days of no
# access -- if this workflow is ever disabled or fails before its save step
# for that long, the next run's "delta" silently widens to whatever window
# survived. Degrades safely either way (see the script's own docstring):
# never a crash, just a wider-than-intended window that self-corrects next
# run.
#
# SCHEDULE IS PROVISIONAL, same as the thresholds inside the script --
# every 6 hours is a starting guess for a project with no real traffic
# history yet, not a calibrated cadence. Revisit once there's a sense of
# how often anything actually changes.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  check-thresholds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caseiq-fastapi
    env:
      SECRET_KEY: ci-observability-alerts-not-a-real-secret-32-chars-min
      # FIXED 2026-09-19: this job's own first real run tripped
      # app.core.config.Settings's DATABASE_URL_DIRECT/DATABASE_URL
      # agreement validator (docs/evaluation.md) -- DATABASE_URL_DIRECT was
      # set, DATABASE_URL_RAW was not, so DATABASE_URL (which the script's
      # import of app.core.config still resolves, even though the script
      # itself only ever uses MIGRATION_DATABASE_URL) fell through to the
      # local POSTGRES_* default and disagreed. The exact partial-override
      # shape as both manual-script incidents the validator was built for
      # -- this is its first real catch of a CI workflow, not a script.
      # Both set to the SAME value on purpose: this script never needs the
      # pooled endpoint, so there's no reason to provision or reference a
      # second secret just to satisfy the agreement check.
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      DATABASE_URL_RAW: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: caseiq-fastapi/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore last-observed counter state
        uses: actions/cache/restore@v4
        with:
          path: caseiq-fastapi/current_state.json
          key: observability-state-${{ github.run_id }}
          restore-keys: |
            observability-state-

      - name: Check thresholds against real production traffic
        run: python -m scripts.check_observability_thresholds

      - name: Save current counter state for next run
        if: always()
        # always(): the state file must be saved whether this run passed,
        # failed on a real threshold breach, or the script itself errored
        # after writing current_state.json -- a failed run still advances
        # the baseline (see the script's own docstring: it writes state
        # before ever calling sys.exit(1)), otherwise a real, ongoing
        # regression would keep re-alerting on the SAME stale delta window
        # growing larger each run instead of the next run's fresh one.
        uses: actions/cache/save@v4
        with:
          path: caseiq-fastapi/current_state.json
          key: observability-state-${{ github.run_id }}
