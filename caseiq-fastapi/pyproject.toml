[project]
name = "caseiq"
version = "2.0.0"
description = "AI-powered Indian legal-awareness platform (FastAPI)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres+pgvector instance (see tests/integration/conftest.py); not run by `make test`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
